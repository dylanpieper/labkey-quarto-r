name: Quarto Publish

on:
  push:
    branches: [main]
  # Rebuild daily so the dashboard reflects fresh data from the LabKey API.
  # Cron is UTC; 06:00 UTC ≈ start of the US day. GitHub may delay scheduled
  # runs under load, so treat the time as approximate.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("httr2", "dplyr", "purrr", "plotly", "bslib", "htmltools", "readr"))'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: index.qmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
